# La app (API en Go + web en React) corre aquí. Whisper y Ollama corren NATIVOS en el Mac
# (con la GPU vía Metal), porque Docker en macOS no puede usar la GPU de Apple.
name: transcriptor

services:
  app:
    build: .
    image: transcriptor:local
    container_name: transcriptor
    restart: "no"
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "127.0.0.1:${PORT:-4747}:8080" # solo accesible desde tu Mac
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: "${TZ:-UTC}"
      WHISPER_URL: "http://host.docker.internal:${WHISPER_PORT:-8178}"
      OLLAMA_URL: "http://host.docker.internal:${OLLAMA_PORT:-11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:7b}"
      RETENTION_DAYS: "${RETENTION_DAYS:-1}" # 0 = no borrar nunca
    volumes:
      - "${DATA_PATH:-./data}:/data" # tus sesiones: audios, textos y resúmenes
    # Límites: la app casi no consume; solo ffmpeg trabaja un instante por audio.
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
